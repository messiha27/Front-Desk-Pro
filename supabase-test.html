
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Front Desk Pro Connection Test</title>
</head>
<body style="font-family:Arial,sans-serif;padding:24px;line-height:1.6">
  <h1>Front Desk Pro</h1>
  <h2>Supabase Connection Test</h2>
  <p id="status">Checking connection...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="./supabase-client.js"></script>
  <script>
    (async function () {
      const status = document.getElementById("status");
      const client = window.frontDeskProSupabase;

      if (!client) {
        status.textContent =
          "FAILED: Client not initialized. Check configuration and script files.";
        return;
      }

      try {
        const { error } = await client.auth.getSession();

        if (error) throw error;

        status.textContent =
          "CONNECTED: Supabase client initialized and responding.";
      } catch (err) {
        status.textContent =
          "FAILED: " + (err.message || "Connection test failed.");
      }
    })();
  </script>
</body>
</html>
